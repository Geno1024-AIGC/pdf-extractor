name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test (CLI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tools/make_test_pdf.py
          ./build/pdfx list rich.pdf | grep -q "obj 3"
          ./build/pdfx preview rich.pdf 3 | grep -q "hello pdf-extractor"

      - name: Smoke test (GUI, offscreen)
        run: |
          rc=0
          QT_QPA_PLATFORM=offscreen timeout 5 ./build/pdfx rich.pdf || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "GUI exited on its own with code $rc before the timeout; expected it to keep running"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-extractor-linux-amd64
          path: build/pdfx
          if-no-files-found: error

  windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-zlib
            python

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        run: cmake --build build

      - name: Smoke test (CLI)
        run: |
          python tools/make_test_pdf.py
          ./build/pdfx.exe list rich.pdf | grep -q "obj 3"
          ./build/pdfx.exe preview rich.pdf 3 | grep -q "hello pdf-extractor"

      - name: Package (bundle Qt, MinGW runtime, zlib)
        run: |
          mkdir -p dist/pdfx
          cp build/pdfx.exe dist/pdfx/
          # zlib + MinGW C/C++ runtime DLLs (windeployqt does not know about them)
          cp /mingw64/bin/zlib1.dll \
             /mingw64/bin/libgcc_s_seh-1.dll \
             /mingw64/bin/libstdc++-1.dll \
             /mingw64/bin/libwinpthread-1.dll dist/pdfx/
          # Qt runtime DLLs + platform plugins (qwindows.dll etc.)
          windeployqt --release --compiler-runtime --no-translations \
            --no-system-d3d-compiler --no-opengl-sw dist/pdfx/pdfx.exe
          echo "bundled files:"
          ls -la dist/pdfx dist/pdfx/platforms

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-extractor-windows-amd64
          path: dist/pdfx
          if-no-files-found: error